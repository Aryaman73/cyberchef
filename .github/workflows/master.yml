name: "Master Build & Test"

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Node 24 is the officially supported version; Node 26 is tested
        # ahead of it becoming the active LTS release (see #2397)
        node-version: [24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set node version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: "https://registry.npmjs.org"

      - name: Install
        env:
          # Fetch the chromedriver build that matches the runner image's own
          # Chrome. The UI tests drive that Chrome (ChromeDriver resolves the
          # system install, not anything we put on PATH), so a driver pinned to
          # a fixed version breaks as soon as the image updates Chrome.
          DETECT_CHROMEDRIVER_VERSION: true
        run: |
          npm ci
          npm run setheapsize

      - name: Lint
        run: npx grunt lint

      - name: Unit Tests
        run: |
          npm test
          npm run testnodeconsumer

      - name: Production Build
        if: success()
        run: npx grunt prod --msg=""

      - name: UI Tests
        if: success()
        run: |
          sudo apt-get install xvfb
          xvfb-run --server-args="-screen 0 1200x800x24" npx grunt testui

